name: Validate and publish Impulse Run

on:
  push:
    branches: [main]
    paths-ignore:
      - 'CI_STATUS.json'
      - 'DEPLOYMENT_STATUS.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-publishing
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Validate relational engine, control-frame engine, renderer and static build
        run: npm test

      - name: Publish immutable static surface to gh-pages
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          rm -rf /tmp/impulse-run-pages
          git worktree add --force /tmp/impulse-run-pages -B gh-pages origin/gh-pages

          find /tmp/impulse-run-pages -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp index.html styles.css control-relations.css package.json README.md LICENSE \
             ASSET_MANIFEST.json THIRD_PARTY_NOTICES.md /tmp/impulse-run-pages/
          cp -R src /tmp/impulse-run-pages/src
          touch /tmp/impulse-run-pages/.nojekyll

          cd /tmp/impulse-run-pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Published assets already match the validated source.'
            exit 0
          fi
          git commit -m "Publish validated Impulse Run from ${GITHUB_SHA}"
          git push origin HEAD:gh-pages
