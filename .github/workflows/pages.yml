name: Validate and publish Apex Relational Racing

on:
  push:
    branches: [main]
    paths-ignore:
      - 'CI_STATUS.json'
      - 'DEPLOYMENT_STATUS.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apex-v4-gh-pages-publishing
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0

      - name: Validate flight, cognition, visuals and static deployment
        run: npm test

      - name: Publish immutable validated surface to gh-pages
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          rm -rf /tmp/apex-relational-pages
          git worktree add --force /tmp/apex-relational-pages -B gh-pages origin/gh-pages
          find /tmp/apex-relational-pages -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp index.html fighter-v4.css package.json README.md DESIGN_CONTRACT.md \
             ASSET_MANIFEST.json THIRD_PARTY_NOTICES.md /tmp/apex-relational-pages/
          cp -R src /tmp/apex-relational-pages/src
          touch /tmp/apex-relational-pages/.nojekyll
          cd /tmp/apex-relational-pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Published assets already match validated source.'
            exit 0
          fi
          git commit -m "Publish validated Apex Relational Racing from ${GITHUB_SHA}"
          git push origin HEAD:gh-pages
