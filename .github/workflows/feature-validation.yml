name: Validate dynamic control relations branch

on:
  push:
    branches:
      - feature/dynamic-control-relations

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run complete project validation
        run: npm test
