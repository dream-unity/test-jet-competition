name: Recover validated Apex v4 source

on:
  push:
    branches: [apex-relational-racing-v4]
    paths:
      - 'bootstrap-v4/**'
      - '.github/workflows/recover-apex-v4.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recover-apex-v4-source
  cancel-in-progress: false

jobs:
  recover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact staged payload
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: apex-relational-racing-v4
          fetch-depth: 0

      - name: Reconstruct, cryptographically verify and test complete source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import base64
          import hashlib
          import shutil
          import tarfile

          expected_sha = 'b4166ceb2314608c9a0bd7d7df9ff7603f81adca14560deb93663184cf10334e'
          expected_names = [f'part-{index:02d}.b64' for index in range(10)]
          parts = sorted(Path('bootstrap-v4').glob('part-*.b64'))
          names = [part.name for part in parts]
          if names != expected_names:
              raise SystemExit(f'Unexpected payload set: {names}')

          chunks = []
          for part in parts:
              clean = ''.join(part.read_text(encoding='ascii').split())
              invalid = set(clean) - set('ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=')
              if invalid:
                  raise SystemExit(f'Invalid base64 characters in {part}: {sorted(invalid)!r}')
              chunks.append(clean)
              print(f'{part}: {len(clean)} base64 characters')

          stream = ''.join(chunks)
          if len(stream) != 83480 or len(stream) % 4:
              raise SystemExit(f'Unexpected combined base64 length: {len(stream)}')

          archive = base64.b64decode(stream.encode('ascii'), validate=True)
          digest = hashlib.sha256(archive).hexdigest()
          if digest != expected_sha:
              raise SystemExit(f'Archive SHA-256 mismatch: expected {expected_sha}, got {digest}')
          if not archive.startswith(b'\x1f\x8b\x08'):
              raise SystemExit('Verified archive is not gzip data')

          archive_path = Path('/tmp/apex-v4.tar.gz')
          destination = Path('/tmp/apex-v4-source')
          archive_path.write_bytes(archive)
          shutil.rmtree(destination, ignore_errors=True)
          destination.mkdir(parents=True)

          with tarfile.open(archive_path, 'r:gz') as bundle:
              members = bundle.getmembers()
              for member in members:
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or '..' in path.parts:
                      raise SystemExit(f'Unsafe archive member: {member.name}')
                  if member.issym() or member.islnk():
                      raise SystemExit(f'Archive links are prohibited: {member.name}')
              bundle.extractall(destination, filter='data')

          required = [
              'index.html',
              'fighter-v4.css',
              'package.json',
              'DESIGN_CONTRACT.md',
              'src/fighter-game.js',
              'src/fighter-flight.js',
              'src/fighter-visuals.js',
              'src/relational-racing.js',
              'tests/relational-validity.test.mjs',
              '.github/workflows/pages.yml',
          ]
          missing = [name for name in required if not (destination / name).is_file()]
          if missing:
              raise SystemExit(f'Archive omitted required files: {missing}')

          print('archive bytes:', len(archive))
          print('archive sha256:', digest)
          print('safe members:', len(members))
          PY

          rsync -a --delete --exclude='.git/' /tmp/apex-v4-source/ ./
          rm -rf bootstrap-v4 .github/workflows/recover-apex-v4.yml

          test -s index.html
          test -s src/fighter-game.js
          test -s src/relational-racing.js
          npm test

      - name: Commit complete validated redesign
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Rebuild as Apex causal relational fighter racing v4'
          git push origin HEAD:apex-relational-racing-v4
