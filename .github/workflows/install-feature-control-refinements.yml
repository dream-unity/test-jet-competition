name: Install tested control refinements on feature branch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-feature-control-refinements.yml'

permissions:
  contents: write

concurrency:
  group: install-feature-control-refinements
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: feature/dynamic-control-relations
          fetch-depth: 0

      - name: Recover exact locally-tested refinement source
        shell: bash
        run: |
          set -euo pipefail
          cat .refine/part-00.b64 .refine/part-01.b64 .refine/part-02.b64 | base64 --decode > /tmp/refine.tar.gz
          echo 'e663780e4757345bbf525e0492af053d7ce63ca8943f39ddd90638bdf4d280d4  /tmp/refine.tar.gz' | sha256sum --check
          rm -rf /tmp/refined-source
          mkdir -p /tmp/refined-source
          tar --extract --gzip --file /tmp/refine.tar.gz --directory /tmp/refined-source
          echo 'bb69071f69912d8f6fda6837e2acfbef95160f98843bde65d5210bce7e33d4fc  /tmp/refined-source/src/control-relations.js' | sha256sum --check
          echo '746be0157adcb0ea87e0fab8bc972d80e2fade008023c649c89d6f7f33a29461  /tmp/refined-source/src/main.js' | sha256sum --check
          echo 'a473d400e76c16db3e600c97b87deef1e3b4678faf7f7afad86e7d7c78b4e245  /tmp/refined-source/tests/control-relations.test.mjs' | sha256sum --check
          echo 'ecbad24c76f324e956838155706a4b4448b38d9e592438353053beca6e106f97  /tmp/refined-source/tests/static.test.mjs' | sha256sum --check
          cp /tmp/refined-source/src/control-relations.js src/control-relations.js
          cp /tmp/refined-source/src/main.js src/main.js
          cp /tmp/refined-source/tests/control-relations.test.mjs tests/control-relations.test.mjs
          cp /tmp/refined-source/tests/static.test.mjs tests/static.test.mjs

      - name: Run complete feature validation
        run: npm test

      - name: Commit verified refinements to target branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/control-relations.js src/main.js tests/control-relations.test.mjs tests/static.test.mjs
          if git diff --cached --quiet; then
            echo 'Verified refinement source is already installed.'
            exit 0
          fi
          git commit -m 'Install tested control-frame inference refinements'
          git pull --rebase origin feature/dynamic-control-relations
          git push origin HEAD:feature/dynamic-control-relations
