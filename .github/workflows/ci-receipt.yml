name: Record CI and Pages state

on:
  push:
    branches: [main]
    paths-ignore:
      - 'CI_STATUS.json'
      - 'DEPLOYMENT_STATUS.json'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0

      - name: Run complete project validation
        run: npm test

      - name: Query Pages configuration
        id: pages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          code=$(curl --silent --show-error \
            --output /tmp/pages-response.json \
            --write-out '%{http_code}' \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")
          echo "http_code=$code" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$code" > /tmp/pages-code.txt

      - name: Commit machine-readable validation receipt
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import json
          import os

          response_path = Path('/tmp/pages-response.json')
          try:
              pages = json.loads(response_path.read_text(encoding='utf-8'))
          except Exception:
              pages = {'raw': response_path.read_text(encoding='utf-8', errors='replace')}
          receipt = {
              'game': 'Impulse Run',
              'source_sha': os.environ['SOURCE_SHA'],
              'tests': 'passed',
              'pages_http_code': Path('/tmp/pages-code.txt').read_text().strip(),
              'pages_response': pages,
              'recorded_at': datetime.now(timezone.utc).isoformat(),
          }
          Path('CI_STATUS.json').write_text(json.dumps(receipt, indent=2) + '\n', encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CI_STATUS.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record passing CI and Pages state [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
