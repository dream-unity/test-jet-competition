name: Record Apex v4 validation and Pages state

on:
  push:
    branches: [main]
    paths-ignore:
      - 'CI_STATUS.json'
      - 'DEPLOYMENT_STATUS.json'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0

      - name: Run complete project validation
        run: npm test

      - name: Query Pages state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$GITHUB_REPOSITORY/pages"
          curl --fail --silent --show-error \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$api" > /tmp/pages.json

      - name: Commit machine-readable validation receipt
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import json
          import os

          receipt = {
              'game': 'Apex Relational Racing',
              'architecture': 'causal-relational-fighter-racing-v4',
              'source_sha': os.environ['SOURCE_SHA'],
              'tests': 'passed',
              'validated_components': [
                  'quaternion fighter flight',
                  '3D course and checkpoints',
                  'causal relational families',
                  'noisy trajectory-model identification',
                  'reasoning/motor dissociation',
                  'procedural fighter geometry',
                  'static GitHub Pages surface',
              ],
              'pages_response': json.loads(Path('/tmp/pages.json').read_text(encoding='utf-8')),
              'recorded_at': datetime.now(timezone.utc).isoformat(),
          }
          Path('CI_STATUS.json').write_text(json.dumps(receipt, indent=2) + '\n', encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CI_STATUS.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record passing Apex v4 validation [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
