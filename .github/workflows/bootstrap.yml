name: Install, test and deploy Impulse Run

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/**'
      - '.github/workflows/bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: impulse-run-installation
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Recover and verify complete game source
        shell: bash
        run: |
          set -euo pipefail
          expected='07d5f768f952e5c585158e7680af63c68176f5686323d5e2fd0e7805970eeffb'
          mapfile -t parts < <(find .bootstrap -maxdepth 1 -type f -name 'part-*' | sort)
          if [ "${#parts[@]}" -ne 5 ]; then
            echo "Expected 5 source parts; found ${#parts[@]}" >&2
            exit 1
          fi
          cat "${parts[@]}" | tr -d '\r\n[:space:]' | base64 --decode > /tmp/impulse-run.tar.gz
          echo "$expected  /tmp/impulse-run.tar.gz" | sha256sum --check --strict

          rm -rf /tmp/impulse-run-source
          mkdir -p /tmp/impulse-run-source
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import tarfile

          archive = Path('/tmp/impulse-run.tar.gz')
          destination = Path('/tmp/impulse-run-source')
          with tarfile.open(archive, 'r:gz') as bundle:
              members = bundle.getmembers()
              for member in members:
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or '..' in path.parts:
                      raise SystemExit(f'Unsafe archive path: {member.name}')
                  if member.issym() or member.islnk():
                      raise SystemExit(f'Archive links are not permitted: {member.name}')
              bundle.extractall(destination, filter='data')
          required = [
              'index.html', 'styles.css', 'src/main.js', 'src/renderer.js',
              'src/relational.js', 'src/systems.js', 'package.json',
              '.github/workflows/pages.yml'
          ]
          missing = [name for name in required if not (destination / name).is_file()]
          if missing:
              raise SystemExit(f'Archive omitted required files: {missing}')
          print(f'Verified and extracted {len(members)} safe archive members')
          PY

          rsync -a --delete --exclude='.git/' /tmp/impulse-run-source/ ./
          rm -rf .bootstrap .github/workflows/bootstrap.yml
          test -s index.html
          test -s src/main.js

      - name: Validate relational engine, renderer and static deployment
        run: npm test

      - name: Commit tested source directly to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Deploy complete Impulse Run relational jet racing game'
          git push origin HEAD:main

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload tested game artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: Deploy Impulse Run to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@decdde0ac072f6dcbe43649c70c934509e0e983d # v4.0.5
