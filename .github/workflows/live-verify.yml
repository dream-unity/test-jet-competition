name: Verify live Impulse Run deployment

on:
  push:
    branches: [main]
    paths-ignore:
      - 'CI_STATUS.json'
      - 'DEPLOYMENT_STATUS.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-deployment-verification
  cancel-in-progress: true

jobs:
  verify-live:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Wait for live endogenous racing files to exactly match tested source
        shell: bash
        env:
          PAGE_URL: https://dream-unity.github.io/test-jet-competition
        run: |
          set -euo pipefail
          files=(
            index.html
            styles.css
            control-relations.css
            src/main.js
            src/renderer.js
            src/relational.js
            src/control-relations.js
            src/systems.js
            src/world-relations.js
            src/world-racing.js
          )
          mkdir -p /tmp/live/src
          matched='false'
          for attempt in $(seq 1 30); do
            matched='true'
            for path in "${files[@]}"; do
              if ! curl --fail --location --silent --show-error \
                --retry 3 --retry-all-errors --retry-delay 2 \
                "$PAGE_URL/$path?source=${GITHUB_SHA}" --output "/tmp/live/$path"; then
                matched='false'
                break
              fi
              if ! cmp --silent "$path" "/tmp/live/$path"; then
                matched='false'
                break
              fi
            done
            if [ "$matched" = 'true' ]; then
              break
            fi
            echo "Deployment has not propagated yet (attempt $attempt/30)."
            sleep 5
          done
          test "$matched" = 'true'
          grep -q '<title>Impulse Run' /tmp/live/index.html
          grep -q 'src/world-racing.js' /tmp/live/index.html
          grep -q 'generateWorldSchedule' /tmp/live/src/world-relations.js
          grep -q 'reasoningDrive' /tmp/live/src/world-racing.js
          grep -q 'moving-frame-field' /tmp/live/src/world-racing.js
          if grep -q 'correctIndex\|candidate\.pattern\|renderPattern(' /tmp/live/src/world-racing.js; then
            echo 'Active endogenous runtime unexpectedly contains picture-answer logic.' >&2
            exit 1
          fi
          sha256sum \
            /tmp/live/index.html \
            /tmp/live/styles.css \
            /tmp/live/control-relations.css \
            /tmp/live/src/*.js > /tmp/live-checksums.txt

      - name: Commit verified deployment receipt
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          PAGE_URL: https://dream-unity.github.io/test-jet-competition/
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import json
          import os

          receipt = {
              'game': 'Impulse Run',
              'deployment': 'verified-live',
              'architecture': 'endogenous-relational-racing-v2',
              'page_url': os.environ['PAGE_URL'],
              'source_sha': os.environ['SOURCE_SHA'],
              'files_compared': [
                  'index.html', 'styles.css', 'control-relations.css',
                  'src/main.js', 'src/renderer.js', 'src/relational.js',
                  'src/control-relations.js', 'src/systems.js',
                  'src/world-relations.js', 'src/world-racing.js'
              ],
              'sha256': Path('/tmp/live-checksums.txt').read_text(encoding='utf-8').splitlines(),
              'verified_at': datetime.now(timezone.utc).isoformat(),
          }
          Path('DEPLOYMENT_STATUS.json').write_text(
              json.dumps(receipt, indent=2) + '\n', encoding='utf-8'
          )
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DEPLOYMENT_STATUS.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record verified live Impulse Run deployment [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
