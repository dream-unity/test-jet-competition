name: Verify live Impulse Run deployment

on:
  push:
    branches: [main]
    paths-ignore:
      - 'CI_STATUS.json'
      - 'DEPLOYMENT_STATUS.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-live:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0

      - name: Verify live files exactly match tested source
        shell: bash
        env:
          PAGE_URL: https://dream-unity.github.io/test-jet-competition
        run: |
          set -euo pipefail
          mkdir -p /tmp/live/src
          for path in index.html styles.css src/main.js src/renderer.js src/relational.js src/systems.js; do
            curl --fail --location --silent --show-error \
              --retry 18 --retry-all-errors --retry-delay 5 \
              "$PAGE_URL/$path" --output "/tmp/live/$path"
            cmp --silent "$path" "/tmp/live/$path"
          done
          grep -q '<title>Impulse Run' /tmp/live/index.html
          grep -q 'IMPULSE RUN' /tmp/live/index.html
          sha256sum /tmp/live/index.html /tmp/live/styles.css /tmp/live/src/*.js > /tmp/live-checksums.txt

      - name: Commit verified deployment receipt
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          PAGE_URL: https://dream-unity.github.io/test-jet-competition/
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import json
          import os

          receipt = {
              'game': 'Impulse Run',
              'deployment': 'verified-live',
              'page_url': os.environ['PAGE_URL'],
              'source_sha': os.environ['SOURCE_SHA'],
              'files_compared': [
                  'index.html', 'styles.css', 'src/main.js', 'src/renderer.js',
                  'src/relational.js', 'src/systems.js'
              ],
              'sha256': Path('/tmp/live-checksums.txt').read_text(encoding='utf-8').splitlines(),
              'verified_at': datetime.now(timezone.utc).isoformat(),
          }
          Path('DEPLOYMENT_STATUS.json').write_text(
              json.dumps(receipt, indent=2) + '\n', encoding='utf-8'
          )
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DEPLOYMENT_STATUS.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record verified live Impulse Run deployment [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
