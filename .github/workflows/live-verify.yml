name: Verify live Apex Relational Racing deployment

on:
  push:
    branches: [main]
    paths-ignore:
      - 'CI_STATUS.json'
      - 'DEPLOYMENT_STATUS.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apex-v4-live-deployment-verification
  cancel-in-progress: true

jobs:
  verify-live:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0

      - name: Wait for the live fighter runtime to exactly match tested source
        shell: bash
        env:
          PAGE_URL: https://dream-unity.github.io/test-jet-competition
        run: |
          set -euo pipefail
          files=(
            index.html
            fighter-v4.css
            src/math3d.js
            src/renderer-v4.js
            src/fighter-audio.js
            src/fighter-input.js
            src/fighter-flight.js
            src/course3d.js
            src/fighter-visuals.js
            src/relational-racing.js
            src/fighter-game.js
          )
          mkdir -p /tmp/apex-live/src
          matched='false'
          for attempt in $(seq 1 36); do
            matched='true'
            for path in "${files[@]}"; do
              if ! curl --fail --location --silent --show-error \
                --retry 3 --retry-all-errors --retry-delay 2 \
                "$PAGE_URL/$path?source=${GITHUB_SHA}" --output "/tmp/apex-live/$path"; then
                matched='false'
                break
              fi
              if ! cmp --silent "$path" "/tmp/apex-live/$path"; then
                matched='false'
                break
              fi
            done
            if [ "$matched" = 'true' ]; then break; fi
            echo "Deployment has not propagated yet (attempt $attempt/36)."
            sleep 5
          done
          test "$matched" = 'true'
          grep -q '<title>Apex Relational Racing' /tmp/apex-live/index.html
          grep -q 'src/fighter-game.js' /tmp/apex-live/index.html
          grep -q 'new FighterFlightModel' /tmp/apex-live/src/fighter-game.js
          grep -q 'scoreTrajectoryHypotheses' /tmp/apex-live/src/fighter-game.js
          grep -q 'vortex-convergence' /tmp/apex-live/src/relational-racing.js
          grep -q 'orientation' /tmp/apex-live/src/fighter-flight.js
          if grep -Eq 'correctIndex|candidate\.pattern|renderPattern\(|src/main\.js|world-racing\.js' \
             /tmp/apex-live/index.html /tmp/apex-live/src/fighter-game.js; then
            echo 'Live surface unexpectedly contains rejected legacy puzzle runtime.' >&2
            exit 1
          fi
          sha256sum /tmp/apex-live/index.html /tmp/apex-live/fighter-v4.css /tmp/apex-live/src/*.js \
            > /tmp/apex-live-checksums.txt

      - name: Commit verified deployment receipt
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          PAGE_URL: https://dream-unity.github.io/test-jet-competition/
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import json
          import os

          receipt = {
              'game': 'Apex Relational Racing',
              'deployment': 'verified-live',
              'architecture': 'causal-relational-fighter-racing-v4',
              'page_url': os.environ['PAGE_URL'],
              'source_sha': os.environ['SOURCE_SHA'],
              'files_compared': [
                  'index.html', 'fighter-v4.css',
                  'src/math3d.js', 'src/renderer-v4.js', 'src/fighter-audio.js',
                  'src/fighter-input.js', 'src/fighter-flight.js', 'src/course3d.js',
                  'src/fighter-visuals.js', 'src/relational-racing.js', 'src/fighter-game.js',
              ],
              'sha256': Path('/tmp/apex-live-checksums.txt').read_text(encoding='utf-8').splitlines(),
              'verified_at': datetime.now(timezone.utc).isoformat(),
          }
          Path('DEPLOYMENT_STATUS.json').write_text(json.dumps(receipt, indent=2) + '\n', encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DEPLOYMENT_STATUS.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record verified live Apex v4 deployment [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
