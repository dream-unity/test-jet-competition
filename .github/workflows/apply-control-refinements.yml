name: Install verified control-frame refinements

on:
  push:
    branches:
      - feature/dynamic-control-relations
    paths:
      - '.refine/**'
      - '.github/workflows/apply-control-refinements.yml'

permissions:
  contents: write

concurrency:
  group: install-control-frame-refinements
  cancel-in-progress: false

jobs:
  install-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: feature/dynamic-control-relations
          fetch-depth: 0

      - name: Recover and verify exact tested refinement payload
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import base64
          import hashlib
          import shutil
          import tarfile

          expected_archive = 'e663780e4757345bbf525e0492af053d7ce63ca8943f39ddd90638bdf4d280d4'
          expected_files = {
              'src/control-relations.js': 'bb69071f69912d8f6fda6837e2acfbef95160f98843bde65d5210bce7e33d4fc',
              'src/main.js': '746be0157adcb0ea87e0fab8bc972d80e2fade008023c649c89d6f7f33a29461',
              'tests/control-relations.test.mjs': 'a473d400e76c16db3e600c97b87deef1e3b4678faf7f7afad86e7d7c78b4e245',
              'tests/static.test.mjs': 'ecbad24c76f324e956838155706a4b4448b38d9e592438353053beca6e106f97',
          }
          parts = sorted(Path('.refine').glob('part-[0-9][0-9].b64'))
          expected_parts = [Path(f'.refine/part-{index:02d}.b64') for index in range(3)]
          if parts != expected_parts:
              raise SystemExit(f'Unexpected payload set: {parts}')

          encoded = ''.join(''.join(path.read_text(encoding='ascii').split()) for path in parts)
          archive = base64.b64decode(encoded.encode('ascii'), validate=True)
          digest = hashlib.sha256(archive).hexdigest()
          if digest != expected_archive:
              raise SystemExit(f'Archive SHA-256 mismatch: {digest}')

          archive_path = Path('/tmp/control-frame-refinements.tar.gz')
          destination = Path('/tmp/control-frame-refinements')
          archive_path.write_bytes(archive)
          shutil.rmtree(destination, ignore_errors=True)
          destination.mkdir(parents=True)

          with tarfile.open(archive_path, 'r:gz') as bundle:
              members = bundle.getmembers()
              for member in members:
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or '..' in path.parts or not (member.isfile() or member.isdir()):
                      raise SystemExit(f'Unsafe archive member: {member.name}')
              bundle.extractall(destination, filter='data')

          for relative, expected in expected_files.items():
              source = destination / relative
              if not source.is_file():
                  raise SystemExit(f'Missing payload file: {relative}')
              actual = hashlib.sha256(source.read_bytes()).hexdigest()
              if actual != expected:
                  raise SystemExit(f'Payload file hash mismatch for {relative}: {actual}')
              target = Path(relative)
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, target)

          css_path = Path('control-relations.css')
          css = css_path.read_text(encoding='utf-8')
          old = '''.cr-output-frame .cr-probe-a,
          .cr-mini-output .cr-probe-a {
            background: var(--cr-magenta);
            box-shadow: 0 0 4px #fff, 0 0 14px var(--cr-magenta), 0 0 24px rgba(255, 79, 216, 0.55);
          }

          .cr-output-frame .cr-probe-b,
          .cr-mini-output .cr-probe-b {
            background: var(--cr-green);
            box-shadow: 0 0 4px #fff, 0 0 12px var(--cr-green), 0 0 22px rgba(117, 255, 155, 0.52);
          }
          '''
          new = '''.cr-output-frame .cr-probe-a,
          .cr-mini-output .cr-probe-a {
            background: var(--cr-cyan);
            box-shadow: 0 0 4px #fff, 0 0 14px var(--cr-cyan), 0 0 24px rgba(85, 247, 255, 0.55);
          }

          .cr-output-frame .cr-probe-b,
          .cr-mini-output .cr-probe-b {
            background: var(--cr-gold);
            box-shadow: 0 0 4px #fff, 0 0 12px var(--cr-gold), 0 0 22px rgba(255, 209, 102, 0.52);
          }
          '''
          if old not in css:
              raise SystemExit('Expected output-probe CSS block was not found')
          css_path.write_text(css.replace(old, new, 1), encoding='utf-8')

          readme_path = Path('README.md')
          readme = readme_path.read_text(encoding='utf-8')
          readme = readme.replace(
              'Before activation, two non-collinear moving probes directly demonstrate the upcoming transformation.',
              'Before activation, two non-collinear moving probes directly demonstrate the upcoming transformation in both a high-legibility HUD frame and a player-relative in-course hologram.'
          )
          readme = readme.replace(
              '- first meaningful action, inference latency and first-action correctness;',
              '- pre-activation trajectory reference, predictive compensation, first meaningful action, inference latency and first-action correctness;'
          )
          readme_path.write_text(readme, encoding='utf-8')

          shutil.rmtree('.refine')
          Path('.github/workflows/apply-control-refinements.yml').unlink()
          print('Verified and installed refinement archive:', digest)
          PY

      - name: Run complete validation suite
        run: npm test

      - name: Confirm installed cryptographic identities
        shell: bash
        run: |
          set -euo pipefail
          echo 'bb69071f69912d8f6fda6837e2acfbef95160f98843bde65d5210bce7e33d4fc  src/control-relations.js' | sha256sum --check
          echo '746be0157adcb0ea87e0fab8bc972d80e2fade008023c649c89d6f7f33a29461  src/main.js' | sha256sum --check
          echo 'a473d400e76c16db3e600c97b87deef1e3b4678faf7f7afad86e7d7c78b4e245  tests/control-relations.test.mjs' | sha256sum --check
          echo 'ecbad24c76f324e956838155706a4b4448b38d9e592438353053beca6e106f97  tests/static.test.mjs' | sha256sum --check

      - name: Commit tested refinements to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Refine dynamic control-frame inference and in-world cues'
          git pull --rebase origin feature/dynamic-control-relations
          git push origin HEAD:feature/dynamic-control-relations
